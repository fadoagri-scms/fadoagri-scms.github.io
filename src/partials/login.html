<div class="modal-overlay login-overlay active" id="login-overlay">
    <div class="login-card">
      <div class="login-logo"><img src="assets/logo-fadoagri-cropped.png" alt="FADO Agri"></div>
      <div class="login-brand-title">FADO AGRI</div>
      <div class="login-brand-sub">Chuỗi cung ứng xuất khẩu</div>
      <div class="login-divider"></div>
      <form id="form-login" class="login-form">
        <div class="form-group form-group-full">
          <label for="login-email">Email</label>
          <div class="input-icon-wrap">
            <i class="ti ti-mail"></i>
            <input type="email" id="login-email" placeholder="ban@fadogroup.com.au" required autocomplete="username">
          </div>
        </div>
        <div class="form-group form-group-full">
          <label for="login-password">Mật khẩu</label>
          <div class="input-icon-wrap">
            <i class="ti ti-lock"></i>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>
        <div id="login-error" style="font-size:12.5px;color:var(--red);min-height:16px;margin-bottom:2px;"></div>
        <div class="modal-actions" style="justify-content:stretch;">
          <button type="submit" class="btn-primary" id="btn-submit-login" style="width:100%;justify-content:center;">Đăng nhập</button>
        </div>
      </form>
    </div>
  </div>
