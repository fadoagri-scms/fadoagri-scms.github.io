<!DOCTYPE html>

<body>

<aside class="sidebar gated">
  {{BRAND}}
  <nav>
    {{NAV}}
  </nav>
  {{SIDEBAR_FOOT}}
</aside>

<main class="main gated">

  {{TOPBAR}}

  {{TAB_OVERVIEW}}

  {{TAB_ORDERS}}

  {{TAB_RAW}}

  {{TAB_NCC}}

  {{TAB_FACTORY}}

  {{TAB_QC}}

<div class="modal-overlay" id="confirm-overlay">
  <div class="modal modal-confirm">
    <div class="modal-header">
      <div class="modal-title" id="confirm-title">Xác nhận</div>
    </div>
    <div class="modal-confirm-body" id="confirm-message"></div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="confirm-cancel-btn">Hủy</button>
      <button type="button" class="btn-danger" id="confirm-ok-btn">Xóa</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- Nguồn gợi ý dùng chung cho các ô hay bị gõ lại tay (xem fillDatalist
     trong app.js) — đặt ở đây vì nhiều tab cùng tham chiếu 1 danh sách. -->
<datalist id="dl-batch-names"></datalist>
<datalist id="dl-raw-suppliers"></datalist>
<datalist id="dl-suppliers"></datalist>
